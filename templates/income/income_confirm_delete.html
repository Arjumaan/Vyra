{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Delete Income</h2>
    <a href="{% url 'income_list' %}" class="btn btn-secondary">Back to List</a>
</div>

<div class="card p-4 shadow-sm border-0 col-md-6 mx-auto text-center">
    <i class="bi bi-exclamation-triangle text-danger fs-1 mb-3"></i>
    <h4>Are you sure you want to delete this income record?</h4>
    <p class="text-muted mt-2">
        <strong>Source:</strong> {{ income.source }}<br>
        <strong>Amount:</strong> ₹{{ income.amount }}<br>
        <strong>Date:</strong> {{ income.date }}
    </p>
    
    <form method="post" class="mt-4">
        {% csrf_token %}
        <a href="{% url 'income_list' %}" class="btn btn-outline-secondary me-2">Cancel</a>
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
    </form>
</div>
{% endblock %}
